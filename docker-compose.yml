# Multi-Agent Planner Docker Compose
# ===================================
# Start: docker compose up
# Stop:  docker compose down

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FILE=/app/logs/app.log
    volumes:
      # Persist outputs and logs
      - ./output:/app/output
      - ./logs:/app/logs
      - ./memory:/app/memory
    restart: unless-stopped
    healthcheck:
      # python:3.11-slim has no curl; use stdlib urllib instead
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Run CLI mode instead
  cli:
    build:
      context: .
      dockerfile: Dockerfile
    profiles:
      - cli
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      - ./output:/app/output
      - ./memory:/app/memory
    stdin_open: true
    tty: true
    command: python main.py
